name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Install & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # On-device end-to-end tests require a connected Android device and
      # cannot run on standard GitHub-hosted runners. Run `npm test` locally
      # or on a self-hosted runner with an attached device/emulator.
      # - name: Run tests
      #   run: npm test
